name = "partitions-leanblueprint"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PartitionsLeanblueprint"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"
[[lean_lib]]
name = "PartitionsLeanblueprint"

[[require]]
name = "LeanModularForms"
git = "https://github.com/dozenalist/LeanModularForms.git"
rev = "master"


[[require]]
name = "mathlib"
scope = "leanprover-community"
